// js/ui.js – HUD + Pause-menu (canvas-drawn HUD, HTML-div menu)


class HUD {
    constructor(player, skillTree) {
        this.player    = player;
        this.skillTree = skillTree;
        this.dmgNumbers = [];
    }

    addDmgNumber(x, y, value, crit = false, headshot = false) {
        if (!FEATURES.damageNumbers) return;
        this.dmgNumbers.push(new DmgNumber(x, y, value, crit, headshot));
    }

    update(dt) {
        for (let i = this.dmgNumbers.length-1; i >= 0; i--) {
            this.dmgNumbers[i].update(dt);
            if (!this.dmgNumbers[i].alive) this.dmgNumbers.splice(i, 1);
        }
    }

    render(ctx, cam, game) {
        // Damage numbers
        for (const d of this.dmgNumbers) d.render(ctx, cam);

        // ── Bottom bar background ─────────────────────────────────────────
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, CFG.CAM_H - 58, CFG.CAM_W, 58);

        const p   = this.player;
        const w   = p.weapon;
        const sk  = this.skillTree;

        // ── Health bar ────────────────────────────────────────────────────
        this._drawBar(ctx, 16, CFG.CAM_H-50, 160, 12, p.hp,
            p.maxHp + (sk.bonuses.maxHp||0),
            p.hp > 50 ? '#44CC44' : p.hp > 25 ? '#FFAA00' : '#FF2222',
            '❤', '#FF4444');

        // Shield bar
        if (FEATURES.shieldArmor) {
            this._drawBar(ctx, 16, CFG.CAM_H-32, 160, 9, p.shield, p.maxShield,
                '#00BFFF', '🛡', '#00BFFF');
        }

        // ── Ammo ──────────────────────────────────────────────────────────
        const ammoX = 200;
        ctx.fillStyle = '#999';
        ctx.font = '11px Courier New'; ctx.textAlign = 'left';
        ctx.fillText(w.name, ammoX, CFG.CAM_H-44);

        const ammo = p.ammo[w.id];
        const maxA = Math.round(w.magSize * (1 + (sk.bonuses.ammoCapacity||0)));
        ctx.fillStyle = ammo < 5 ? '#FF4444' : '#DDCC88';
        ctx.font = 'bold 22px Courier New';
        ctx.fillText(p.reloading ? 'RELOAD...' : `${ammo}/${maxA}`, ammoX, CFG.CAM_H-22);

        // Minigun spin indicator
        if (w.id === 10) {
            ctx.fillStyle = p.minigunRate > 0.85 ? '#44FF44' : '#FFAA00';
            ctx.font = '11px Courier New';
            ctx.fillText(`⚙ ${Math.round(p.minigunRate*100)}%`, ammoX, CFG.CAM_H-8);
        }

        // Railgun charge indicator
        if (w.id === 14 && p.railCharging) {
            ctx.fillStyle = '#00BFFF';
            ctx.font = '11px Courier New';
            ctx.fillText(`⚡ ${Math.round(p.railCharge*100)}%`, ammoX, CFG.CAM_H-8);
        }

        // ── Grenades ──────────────────────────────────────────────────────
        if (FEATURES.grenades) {
            ctx.fillStyle = '#FFAA00';
            ctx.font = '13px Courier New'; ctx.textAlign = 'left';
            ctx.fillText(`💥 ${p.grenades}`, 380, CFG.CAM_H-22);
        }

        // ── Weapon slots ──────────────────────────────────────────────────
        let slotX = 440;
        for (let i = 0; i < p.weaponSlots.length; i++) {
            const sl = p.weaponSlots[i];
            const active = i === p.weaponIdx;
            ctx.fillStyle = active ? 'rgba(80,70,30,0.8)' : 'rgba(30,28,18,0.6)';
            ctx.fillRect(slotX, CFG.CAM_H-52, 46, 46);
            if (active) {
                ctx.strokeStyle = '#e8c060'; ctx.lineWidth = 1.5;
                ctx.strokeRect(slotX, CFG.CAM_H-52, 46, 46);
            }
            // Color dot
            ctx.fillStyle = sl.color;
            ctx.beginPath(); ctx.arc(slotX+7, CFG.CAM_H-38, 5, 0, Math.PI*2); ctx.fill();
            // Name
            ctx.fillStyle = active ? '#e8c060' : '#776655';
            ctx.font = '9px Courier New'; ctx.textAlign = 'center';
            ctx.fillText(sl.name.substring(0,7), slotX+23, CFG.CAM_H-28);
            // Key
            ctx.fillStyle = '#555';
            ctx.fillText(`[${i+1}]`, slotX+23, CFG.CAM_H-12);
            slotX += 50;
        }

        // ── Dash cooldown ─────────────────────────────────────────────────
        if (FEATURES.dashAbility) {
            const dc = p.dashCD / CFG.DASH_CD;
            ctx.fillStyle = dc <= 0 ? '#44CCFF' : '#335566';
            ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'right';
            ctx.fillText(dc > 0 ? `⚡${dc.toFixed(1)}` : '⚡DASH', CFG.CAM_W - 16, CFG.CAM_H - 40);
        }

        // ── Combo ─────────────────────────────────────────────────────────
        if (FEATURES.comboMultiplier && p.comboCount >= 2) {
            const idx = Math.min(p.comboCount, CFG.COMBO_MULT.length-1);
            const mult = CFG.COMBO_MULT[idx];
            ctx.font = 'bold 18px Courier New'; ctx.textAlign = 'right';
            ctx.fillStyle = `hsl(${60-p.comboCount*8},100%,60%)`;
            ctx.fillText(`x${mult.toFixed(1)} COMBO  ${p.comboCount}`, CFG.CAM_W - 16, CFG.CAM_H - 56);
        }

        // ── Kill streak ───────────────────────────────────────────────────
        if (FEATURES.killStreak && p.streakCount >= 3) {
            ctx.font = 'bold 14px Courier New'; ctx.textAlign = 'right';
            ctx.fillStyle = '#FF8800';
            ctx.fillText(`🔥 ${p.streakCount} STREAK`, CFG.CAM_W - 16, CFG.CAM_H - 72);
        }

        // ── Top HUD ───────────────────────────────────────────────────────
        // XP bar
        const xpW = 260;
        const xpX = CFG.CAM_W/2 - xpW/2;
        const xpPct = p.xpToNext > 0 ? Math.min(1, p.xp / p.xpToNext) : 0;
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(xpX-2, 6, xpW+4, 14);
        ctx.fillStyle = '#225522';
        ctx.fillRect(xpX, 8, xpW, 10);
        ctx.fillStyle = '#44EE44';
        ctx.fillRect(xpX, 8, xpW * xpPct, 10);
        ctx.fillStyle = '#e8c060'; ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(`LVL ${p.level}  XP: ${p.xp}/${p.xpToNext}  SP: ${this.skillTree.points}`, CFG.CAM_W/2, 19);

        // Wave / kills
        if (FEATURES.waveCounter) {
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(CFG.CAM_W-130, 5, 124, 28);
            ctx.fillStyle = '#AAAAAA'; ctx.font = '11px Courier New'; ctx.textAlign = 'right';
            ctx.fillText(`WAVE  ${game.wave}`, CFG.CAM_W-10, 18);
            ctx.fillText(`KILLS ${p.kills}`, CFG.CAM_W-10, 30);
        }

        // Score
        ctx.fillStyle = '#e8c060'; ctx.font = 'bold 13px Courier New'; ctx.textAlign = 'left';
        ctx.fillText(`${p.score}`, 10, 20);

        // ── Day/night ─────────────────────────────────────────────────────
        if (FEATURES.dayNightCycle) {
            const phase  = (game.dayTime % CFG.DAY_PERIOD) / CFG.DAY_PERIOD;
            const isDark = phase > 0.5;
            const icon   = isDark ? '🌙' : '☀';
            ctx.font = '16px Arial'; ctx.textAlign = 'left';
            ctx.fillText(icon, 10, 40);
        }

        // ── Bullet time label ─────────────────────────────────────────────
        if (p.bulletTimeOn) {
            ctx.save();
            ctx.globalAlpha = 0.7;
            ctx.fillStyle = '#44AAFF';
            ctx.font = 'bold 20px Courier New'; ctx.textAlign = 'center';
            ctx.fillText('● BULLET TIME ●', CFG.CAM_W/2, 50);
            ctx.restore();
        }

        // ── Overcharge ────────────────────────────────────────────────────
        if (p.overChargeT > 0) {
            ctx.fillStyle = '#FFAA00'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'left';
            ctx.fillText(`⚡OVERCHARGE ${p.overChargeT.toFixed(1)}s`, 200, 20);
        }

        // ── Mini-map ──────────────────────────────────────────────────────
        if (FEATURES.minimap && game.world) {
            game.world.renderMinimap(ctx, CFG.CAM_W-156, CFG.CAM_H-160, 144, 144,
                game.player, game.enemies);
        }

        // ── Level-up flash ────────────────────────────────────────────────
        if (p.levelUpAnim > 0) {
            const a = Math.min(1, p.levelUpAnim * 0.6);
            ctx.save(); ctx.globalAlpha = a;
            ctx.fillStyle = '#FFD700'; ctx.font = 'bold 30px Courier New'; ctx.textAlign = 'center';
            ctx.fillText(`⬆  LEVEL ${p.level}  ⬆`, CFG.CAM_W/2, CFG.CAM_H/2 - 60);
            ctx.font = '14px Courier New';
            ctx.fillText(`+1 Skill Point  (${this.skillTree.points} available)`, CFG.CAM_W/2, CFG.CAM_H/2 - 28);
            ctx.restore();
        }
    }

    _drawBar(ctx, x, y, w, h, val, max, fillCol, icon, iconCol) {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = fillCol;
        ctx.fillRect(x, y, Math.max(0, w * (val/max)), h);
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
        ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = iconCol || '#fff';
        ctx.font = '10px Arial'; ctx.textAlign = 'left';
        ctx.fillText(`${icon} ${Math.ceil(val)}/${Math.ceil(max)}`, x + w + 5, y + h - 1);
    }
}

// ─── PauseMenu ────────────────────────────────────────────────────────────────
class PauseMenu {
    constructor(game, skillTree) {
        this.game       = game;
        this.skillTree  = skillTree;
        this.activeTab  = 'game';  // 'game' | 'features' | 'skills' | 'armory'
        this.visible    = false;
        this.hoveredSkill = null;

        // Skill canvas
        this.skillCanvas = null;
        this.skillCtx    = null;

        this._build();
    }

    _build() {
        const overlay = document.getElementById('pauseOverlay');
        if (!overlay) return;

        // Tab buttons
        const tabs = ['game', 'features', 'skills', 'armory'];
        const labels = { game:'⚙ GAME', features:'⚡ FEATURES', skills:'🌟 SKILL TREE', armory:'🔫 ARMORY' };
        const tabBar = document.getElementById('tabBar');
        tabBar.innerHTML = '';
        for (const t of tabs) {
            const btn = document.createElement('button');
            btn.className = `tab-btn${t === this.activeTab ? ' active' : ''}`;
            btn.textContent = labels[t];
            btn.dataset.tab = t;
            btn.addEventListener('click', () => this._switchTab(t));
            tabBar.appendChild(btn);
        }

        this._buildGameTab();
        this._buildFeaturesTab();
        this._buildSkillTab();
        this._buildArmoryTab();

        this._switchTab('game');
    }

    _switchTab(tab) {
        this.activeTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === tab);
        });
        document.querySelectorAll('.tab-panel').forEach(p => {
            p.classList.toggle('active', p.id === `tab-${tab}`);
        });
        if (tab === 'skills') this._drawSkillTree();
    }

    _buildGameTab() {
        const panel = document.getElementById('tab-game');
        panel.innerHTML = `
            <div class="section-title">GAME</div>
            <button class="pause-btn" id="btnResume">▶  RESUME</button>
            <button class="pause-btn" id="btnResetSpawns">🔄  RESET ENEMY SPAWNS</button>

            <div class="section-title">DIFFICULTY</div>
            <button class="pause-btn" id="btnDiffEasy">EASY  – fewer, weaker enemies</button>
            <button class="pause-btn" id="btnDiffNorm">NORMAL  – default settings</button>
            <button class="pause-btn" id="btnDiffHard">HARD  – more, tougher enemies</button>

            <div class="section-title">SESSION</div>
            <button class="pause-btn danger" id="btnRestart">↩  RESTART GAME</button>
        `;
        panel.querySelector('#btnResume').addEventListener('click', () => this.hide());
        panel.querySelector('#btnResetSpawns').addEventListener('click', () => {
            this.game.resetEnemySpawns(); this.hide();
        });
        panel.querySelector('#btnDiffEasy').addEventListener('click', () => this.game.setDifficulty('easy'));
        panel.querySelector('#btnDiffNorm').addEventListener('click', () => this.game.setDifficulty('normal'));
        panel.querySelector('#btnDiffHard').addEventListener('click', () => this.game.setDifficulty('hard'));
        panel.querySelector('#btnRestart').addEventListener('click', () => {
            this.hide(); this.game.restart();
        });
    }

    _buildFeaturesTab() {
        const panel = document.getElementById('tab-features');
        panel.innerHTML = '<div class="section-title">TOGGLE FEATURES</div><div class="feat-grid" id="featGrid"></div>';
        const grid = panel.querySelector('#featGrid');
        for (const [key, label] of Object.entries(FEATURE_LABELS)) {
            const el = document.createElement('div');
            el.className = `feat-toggle${FEATURES[key] ? ' on' : ''}`;
            el.id = `feat-${key}`;
            el.innerHTML = `<div class="dot"></div><span class="feat-label">${label}</span>`;
            el.addEventListener('click', () => {
                FEATURES[key] = !FEATURES[key];
                el.classList.toggle('on', FEATURES[key]);
            });
            grid.appendChild(el);
        }
    }

    _buildSkillTab() {
        const panel = document.getElementById('tab-skills');
        panel.innerHTML = `
            <div id="pointsDisplay">SKILL POINTS: <span id="spCount">0</span></div>
            <canvas id="skillCanvas" width="620" height="300"></canvas>
            <div id="skillInfo">Hover a node to see details. Click to purchase.</div>
        `;
        this.skillCanvas = panel.querySelector('#skillCanvas');
        this.skillCtx    = this.skillCanvas.getContext('2d');
        this.skillCanvas.addEventListener('click', (e) => this._onSkillClick(e));
        this.skillCanvas.addEventListener('mousemove', (e) => this._onSkillHover(e));
        this.skillCanvas.addEventListener('mouseleave', () => {
            this.hoveredSkill = null;
            this._drawSkillTree();
        });
    }

    _buildArmoryTab() {
        const panel = document.getElementById('tab-armory');
        let html = '<div class="section-title">WEAPONS</div>';
        for (const w of WEAPON_DEFS) {
            const owned = this.game.player && this.game.player.weaponSlots.find(s => s.id === w.id);
            html += `
            <div class="weapon-card${owned?' owned':''}">
                <div class="wc-color" style="background:${w.color}"></div>
                <div class="wc-name">${w.name}</div>
                <div class="wc-stats">DMG:${w.dmg} | ROF:${(1/w.firerate).toFixed(1)}/s | Range:${w.range} | Mag:${w.magSize}</div>
                ${owned ? '<span class="wc-badge">EQUIPPED</span>' : ''}
            </div>`;
        }
        panel.innerHTML = html;
    }

    // ── Skill tree drawing ───────────────────────────────────────────────────

    _skillNodePos(branchIdx, skillIdx) {
        const cw = 620, ch = 300;
        const cols = 3;
        const branchW = cw / cols;
        const cx = branchW * branchIdx + branchW / 2;
        const yStart = 40, yStep = 36;
        const cy = yStart + skillIdx * yStep;
        return { x: cx, y: cy };
    }

    _drawSkillTree() {
        const canvas = this.skillCanvas;
        if (!canvas) return;
        const ctx = this.skillCtx;
        const sk  = this.skillTree;

        document.getElementById('spCount').textContent = sk.points;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0e0c06'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        const branches = SKILL_TREE.branches;
        for (let bi = 0; bi < branches.length; bi++) {
            const b = branches[bi];

            // Branch title
            const bx = (canvas.width/3)*bi + (canvas.width/3)/2;
            ctx.fillStyle = b.color; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
            ctx.fillText(`${b.icon} ${b.name}`, bx, 18);

            for (let si = 0; si < b.skills.length; si++) {
                const skill = b.skills[si];
                const pos   = this._skillNodePos(bi, si);

                // Connection line to next
                if (si < b.skills.length - 1) {
                    const next = this._skillNodePos(bi, si+1);
                    const purch = sk.isPurchased(skill.id);
                    ctx.strokeStyle = purch ? b.color : '#333';
                    ctx.lineWidth = purch ? 2 : 1;
                    ctx.beginPath(); ctx.moveTo(pos.x, pos.y+12); ctx.lineTo(next.x, next.y-12); ctx.stroke();
                }

                const purchased  = sk.isPurchased(skill.id);
                const canBuy     = sk.canBuy(skill);
                const hovered    = this.hoveredSkill && this.hoveredSkill.id === skill.id;

                // Node circle
                let fill = '#1a1810';
                if (purchased)       fill = b.color;
                else if (canBuy)     fill = '#2a2820';
                else                 fill = '#111';

                ctx.beginPath(); ctx.arc(pos.x, pos.y, 13, 0, Math.PI*2);
                ctx.fillStyle = fill; ctx.fill();

                ctx.strokeStyle = hovered ? '#FFFFFF' : (purchased ? b.color : (canBuy ? '#665' : '#333'));
                ctx.lineWidth   = hovered ? 2.5 : 1.5;
                ctx.beginPath(); ctx.arc(pos.x, pos.y, 13, 0, Math.PI*2); ctx.stroke();

                // Cost badge
                ctx.fillStyle = purchased ? '#000' : (canBuy ? '#FFD700' : '#555');
                ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'center';
                ctx.fillText(purchased ? '✓' : skill.cost, pos.x, pos.y + 4);

                // Label
                ctx.fillStyle = purchased ? '#fff' : (canBuy ? '#ccc' : '#444');
                ctx.font = '9px Courier New'; ctx.textAlign = 'center';
                ctx.fillText(skill.name, pos.x, pos.y + 25);

                // Hover glow
                if (hovered) {
                    ctx.save(); ctx.globalAlpha = 0.25;
                    ctx.fillStyle = b.color;
                    ctx.beginPath(); ctx.arc(pos.x, pos.y, 18, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                }
            }
        }
    }

    _skillAtPos(mouseX, mouseY) {
        for (let bi = 0; bi < SKILL_TREE.branches.length; bi++) {
            const b = SKILL_TREE.branches[bi];
            for (let si = 0; si < b.skills.length; si++) {
                const pos = this._skillNodePos(bi, si);
                if (Math.hypot(mouseX - pos.x, mouseY - pos.y) < 16) return b.skills[si];
            }
        }
        return null;
    }

    _onSkillHover(e) {
        const rect = this.skillCanvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const skill = this._skillAtPos(mx, my);
        this.hoveredSkill = skill;
        this._drawSkillTree();
        const info = document.getElementById('skillInfo');
        if (skill) {
            const canBuy    = this.skillTree.canBuy(skill);
            const purchased = this.skillTree.isPurchased(skill.id);
            info.innerHTML = `<b>${skill.name}</b> – ${skill.desc}<br>Cost: ${skill.cost} pt${skill.cost>1?'s':''}${skill.req?' | Requires: '+skill.req:''}`
                + (purchased ? '  <span style="color:#4f4">✓ Purchased</span>' : canBuy ? '  <span style="color:#fd4">Click to buy</span>' : '  <span style="color:#844">Cannot afford / locked</span>');
        } else {
            info.textContent = 'Hover a node to see details. Click to purchase.';
        }
    }

    _onSkillClick(e) {
        const rect = this.skillCanvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const skill = this._skillAtPos(mx, my);
        if (!skill) return;
        if (this.skillTree.buy(skill)) {
            // Refresh armory (HP might have changed)
            this._buildArmoryTab();
            this._drawSkillTree();
            document.getElementById('spCount').textContent = this.skillTree.points;
            document.getElementById('skillInfo').innerHTML =
                `<span style="color:#4f4">✓ Purchased: ${skill.name}!</span>  ${skill.desc}`;
        }
    }

    // ── show / hide ──────────────────────────────────────────────────────────

    show() {
        this.visible = true;
        const o = document.getElementById('pauseOverlay');
        o.classList.add('visible');
        this._buildArmoryTab();
        if (this.activeTab === 'skills') this._drawSkillTree();
        document.getElementById('spCount').textContent = this.skillTree.points;
    }

    hide() {
        this.visible = false;
        document.getElementById('pauseOverlay').classList.remove('visible');
    }
}

// ──────────────────────────────────────────────────────────────────
// game.js
// ──────────────────────────────────────────────────────────────────
// js/game.js – Main game controller & loop


class Game {
    constructor() {
        this.canvas  = document.getElementById('gameCanvas');
        this.ctx     = this.canvas.getContext('2d');
        this.canvas.width  = CFG.CAM_W;
        this.canvas.height = CFG.CAM_H;

        // Core systems
        this.particles  = new ParticleSystem();
        this.shake      = new ScreenShake();
        this.footprints = new FootprintMgr();
        this.skillTree  = new SkillTreeManager();
        this.world      = null;  // built in init()
        this.player     = null;

        // Entity lists
        this.enemies     = [];
        this.projectiles = [];
        this.items       = [];

        // Game state
        this.state  = 'loading'; // 'loading' | 'playing' | 'paused' | 'dead'
        this.wave   = 0;
        this.spawnTimer = 0;
        this.dayTime    = 0;
        this.difficulty = 'normal';

        // Camera
        this.cam = { x: 0, y: 0 };

        // Input
        this.input = {
            up:false, down:false, left:false, right:false,
            sprint:false, shoot:false, rightClick:false,
        };
        this.mouseX = 0; this.mouseY = 0;  // screen coords

        // UI
        this.hud       = null;
        this.pauseMenu = null;

        // Timing
        this._last = 0;
    }

    // ── initialise ────────────────────────────────────────────────────────────

    init() {
        this.world     = new World();
        const cx       = CFG.WORLD_W / 2, cy = CFG.WORLD_H / 2;
        this.player    = new Player(this.world, this.particles, this.footprints, this.skillTree);
        this.player.x  = cx; this.player.y = cy;
        this.hud       = new HUD(this.player, this.skillTree);
        this.pauseMenu = new PauseMenu(this, this.skillTree);

        this.cam.x = cx - CFG.CAM_W/2;
        this.cam.y = cy - CFG.CAM_H/2;

        this._bindInput();
        this.state = 'playing';
        window._game = this;
    }

    restart() {
        // Hard reset everything
        this.enemies     = [];
        this.projectiles = [];
        this.items       = [];
        this.wave        = 0;
        this.spawnTimer  = 2;
        this.dayTime     = 0;
        this.world       = new World();
        this.skillTree   = new SkillTreeManager();
        const cx         = CFG.WORLD_W/2, cy = CFG.WORLD_H/2;
        this.player      = new Player(this.world, this.particles, this.footprints, this.skillTree);
        this.player.x    = cx; this.player.y = cy;
        this.hud         = new HUD(this.player, this.skillTree);
        this.pauseMenu   = new PauseMenu(this, this.skillTree);
        this.cam.x       = cx - CFG.CAM_W/2;
        this.cam.y       = cy - CFG.CAM_H/2;
        this.state       = 'playing';
        window._game     = this;
        document.getElementById('deathOverlay').classList.remove('visible');
    }

    setDifficulty(diff) {
        this.difficulty = diff;
        // Difficulty affects spawn count/speed – applied at next wave
    }

    resetEnemySpawns() {
        this.enemies     = [];
        this.spawnTimer  = 2;
        this.wave        = Math.max(0, this.wave - 1);
    }

    nearestEnemy(wx, wy, maxDist) {
        let best = null, bd = maxDist * maxDist;
        for (const e of this.enemies) {
            if (!e.alive) continue;
            const d = (e.x-wx)*(e.x-wx) + (e.y-wy)*(e.y-wy);
            if (d < bd) { bd = d; best = e; }
        }
        return best;
    }

    spawnBackup(x, y) {
        if (!FEATURES.enemyBackup) return;
        const count = 2;
        for (let i = 0; i < count; i++) {
            const angle  = Math.random() * Math.PI*2;
            const dist   = 60 + Math.random()*60;
            const bx     = x + Math.cos(angle)*dist;
            const by     = y + Math.sin(angle)*dist;
            const pos    = this.world.nearestWalkableWorld(bx, by);
            if (FEATURES.spawnHighlight) {
                for (let p = 0; p < 6; p++) this.particles.emit(pos.x, pos.y, '#FF8800', 1, 40, 4, 0.6);
            }
            this.enemies.push(spawnEnemy('scout', pos.x, pos.y, this.world));
        }
    }

    onEnemyDied(enemy, player) {
        this.particles.blood(enemy.x, enemy.y, 10);
        this.shake.add(4);
        player.onKill(enemy);
        const drops = spawnLoot(enemy.x, enemy.y, this.world);
        this.items.push(...drops);
        // Chance to drop a new weapon
        if (Math.random() < 0.06 && WEAPON_DEFS.length) {
            const wdef = WEAPON_DEFS[Math.floor(Math.random() * WEAPON_DEFS.length)];
            player.addWeapon(wdef);
        }
    }

    // ── spawn wave ────────────────────────────────────────────────────────────

    _spawnWave() {
        this.wave++;
        const diffMult = this.difficulty === 'easy' ? 0.6 : this.difficulty === 'hard' ? 1.5 : 1;
        const count    = Math.round((CFG.WAVE_BASE_COUNT + (this.wave-1)*CFG.WAVE_INCREMENT) * diffMult);
        const alive    = this.enemies.filter(e => e.alive).length;
        const toSpawn  = Math.min(count, CFG.MAX_ENEMIES - alive);

        for (let i = 0; i < toSpawn; i++) {
            const sp  = this.world.spawnPoints[Math.floor(Math.random()*this.world.spawnPoints.length)];
            const pos = this.world.nearestWalkableWorld(
                sp.x + (Math.random()-0.5)*32, sp.y + (Math.random()-0.5)*32);

            // Pick type
            let type = 'grunt';
            const r  = Math.random();
            if (this.wave >= 2 && r < 0.15) type = 'heavy';
            else if (this.wave >= 2 && r < 0.30) type = 'scout';
            else if (this.wave >= 3 && r < 0.42) type = 'sniper';

            const enemy = spawnEnemy(type, pos.x, pos.y, this.world);
            // Scale stats with wave
            const hpScale = 1 + (this.wave-1)*0.08 * diffMult;
            enemy.hp = enemy.maxHp = Math.round(enemy.maxHp * hpScale);
            this.enemies.push(enemy);

            if (FEATURES.spawnHighlight) {
                this.particles.emit(pos.x, pos.y, '#FF4444', 8, 50, 5, 0.8);
            }
        }

        // Boss every N waves
        if (FEATURES.bossSpawns && this.wave % CFG.BOSS_SPAWN_WAVE === 0) {
            const sp  = this.world.spawnPoints[0];
            const pos = this.world.nearestWalkableWorld(sp.x, sp.y);
            const boss = spawnEnemy('boss', pos.x, pos.y, this.world);
            boss.maxHp = boss.hp = Math.round(700 * (1 + (this.wave/CFG.BOSS_SPAWN_WAVE - 1)*0.25));
            this.enemies.push(boss);
            this.particles.emit(pos.x, pos.y, '#FF0000', 20, 80, 8, 1.0);
        }
    }

    // ── update ────────────────────────────────────────────────────────────────

    _update(dt) {
        if (this.state !== 'playing') return;

        const p    = this.player;
        const ts   = p.bulletTimeOn ? CFG.BULLET_TIME_FACTOR : 1;
        const sdt  = dt * ts;

        this.dayTime += dt;

        // Camera
        const targetCX = p.x - CFG.CAM_W/2;
        const targetCY = p.y - CFG.CAM_H/2;
        this.cam.x += (targetCX - this.cam.x) * Math.min(1, dt*8);
        this.cam.y += (targetCY - this.cam.y) * Math.min(1, dt*8);
        this.cam.x  = Math.max(0, Math.min(CFG.WORLD_W - CFG.CAM_W, this.cam.x));
        this.cam.y  = Math.max(0, Math.min(CFG.WORLD_H - CFG.CAM_H, this.cam.y));

        // Mouse → world coords
        const mouseWorldX = this.mouseX / p.scopeZoom + this.cam.x + (p.scopeZoom > 1 ? (CFG.CAM_W/2*(1 - 1/p.scopeZoom)) : 0);
        const mouseWorldY = this.mouseY / p.scopeZoom + this.cam.y + (p.scopeZoom > 1 ? (CFG.CAM_H/2*(1 - 1/p.scopeZoom)) : 0);

        // Player update
        p.update(sdt, this.input, mouseWorldX, mouseWorldY, this.projectiles);

        if (this.input.shoot) p.shoot(mouseWorldX, mouseWorldY, this.projectiles);

        // Enemy spawn timer
        this.spawnTimer -= dt;
        if (this.spawnTimer <= 0) {
            this.spawnTimer = CFG.SPAWN_INTERVAL;
            this._spawnWave();
        }

        // Enemies
        const aliveEnemies = this.enemies.filter(e => e.alive);
        for (const e of aliveEnemies) {
            e.update(sdt, p, this.projectiles, this);
        }
        // Separation force between enemies
        for (let i = 0; i < aliveEnemies.length; i++) {
            for (let j = i+1; j < aliveEnemies.length; j++) {
                const a = aliveEnemies[i], b = aliveEnemies[j];
                const dx = b.x - a.x, dy = b.y - a.y;
                const d  = Math.hypot(dx, dy);
                const minD = a.r + b.r + 2;
                if (d < minD && d > 0) {
                    const push = (minD - d) / 2;
                    const px   = (dx/d)*push, py = (dy/d)*push;
                    if (this.world.isWalkable(a.x-px, a.y-py)) { a.x -= px; a.y -= py; }
                    if (this.world.isWalkable(b.x+px, b.y+py)) { b.x += px; b.y += py; }
                }
            }
        }

        // Remove dead enemies
        for (let i = this.enemies.length-1; i >= 0; i--) {
            if (!this.enemies[i].alive) this.enemies.splice(i, 1);
        }

        // Projectiles
        for (const proj of this.projectiles) proj.update(sdt);

        // Projectile–enemy collision
        for (const proj of this.projectiles) {
            if (!proj.alive) continue;
            if (proj.owner !== 'player') continue;

            // Barrel hits
            for (const barrel of this.world.barrels) {
                if (barrel.exploded) continue;
                if (Math.hypot(proj.x-barrel.x, proj.y-barrel.y) < 14) {
                    const exploded = this.world.damageBarrel(barrel, proj.dmg, this.particles);
                    if (exploded) {
                        this.shake.add(14);
                        this._barrelBlast(barrel);
                    }
                    if (!proj.pierce) proj.alive = false;
                    break;
                }
            }

            for (const enemy of this.enemies) {
                if (!enemy.alive) continue;
                if (proj.hitSet.has(enemy)) continue;
                const d = Math.hypot(proj.x - enemy.x, proj.y - enemy.y);
                if (d > enemy.r + 5) continue;

                // Hit!
                let dmg = proj.dmg;
                let crit = false, headshot = false;

                // Headshot (enemy "head" is upper portion of hitbox)
                if (FEATURES.headshotBonus && (proj.y - enemy.y) < -enemy.r * 0.3) {
                    headshot = true;
                    dmg = Math.round(dmg * 1.8);
                }
                // Critical hit
                if (FEATURES.criticalHits) {
                    const chance = (this.skillTree.bonuses.critChance || 0.05);
                    if (Math.random() < chance) {
                        crit = true;
                        dmg  = Math.round(dmg * (1 + (this.skillTree.bonuses.critDmg || 1.0)));
                    }
                }

                // Flame DoT
                if (proj.projType === 'flame') {
                    enemy.burnTimer = Math.max(enemy.burnTimer, 2.5);
                    enemy.burnDps   = proj.def.dot || 2;
                }
                // EMP stun
                if (proj.projType === 'grenade' && FEATURES.grenades && this.skillTree.bonuses.empGrenades) {
                    enemy.stunTimer = Math.max(enemy.stunTimer, 2.0);
                }

                const killed = enemy.takeDamage(dmg);
                this.particles.blood(proj.x, proj.y, 6);
                this.hud.addDmgNumber(enemy.x, enemy.y - enemy.r - 12, dmg, crit, headshot);
                this.shake.add(crit ? 6 : 3);

                if (killed) {
                    enemy.alive = false;
                    this.onEnemyDied(enemy, p);
                }

                if (!proj.pierce) { proj.alive = false; break; }
                proj.hitSet.add(enemy);
            }
        }

        // Projectile–player collision (enemy bullets)
        for (const proj of this.projectiles) {
            if (!proj.alive || proj.owner !== 'enemy') continue;
            const d = Math.hypot(proj.x - p.x, proj.y - p.y);
            if (d < p.r + 4) {
                const dead = p.takeDamage(proj.dmg);
                this.shake.add(8);
                this.particles.blood(p.x, p.y, 4);
                proj.alive = false;
                if (dead) { this.state = 'dead'; this._showDeath(); }
            }
        }

        // Grenade & rocket AoE
        for (const proj of this.projectiles) {
            if (!proj.alive && proj.explosive) {
                const radius = proj.def.id === 12 ? 100 : CFG.GRENADE_RADIUS;
                const dmg    = proj.dmg * (1 + (this.skillTree.bonuses.explDmg||0));
                this.particles.explosion(proj.x, proj.y, radius);
                this.shake.add(18);
                for (const enemy of this.enemies) {
                    if (!enemy.alive) continue;
                    const d = Math.hypot(proj.x - enemy.x, proj.y - enemy.y);
                    if (d < radius) {
                        const falloff = 1 - (d / radius) * 0.7;
                        const killed  = enemy.takeDamage(Math.round(dmg * falloff));
                        this.hud.addDmgNumber(enemy.x, enemy.y-20, Math.round(dmg*falloff));
                        if (killed) { enemy.alive=false; this.onEnemyDied(enemy, p); }
                        if (proj.projType === 'grenade' && this.skillTree.bonuses.empGrenades) {
                            enemy.stunTimer = Math.max(enemy.stunTimer, 2.0);
                        }
                    }
                }
                // Damage player if too close
                const dpd = Math.hypot(proj.x - p.x, proj.y - p.y);
                if (dpd < radius * 0.5 && proj.owner === 'player') {
                    const dead = p.takeDamage(Math.round(dmg * 0.3));
                    if (dead) { this.state='dead'; this._showDeath(); }
                }
            }
        }

        // Remove dead projectiles (but keep explosive ones alive for 1 frame for AoE above)
        for (let i = this.projectiles.length-1; i >= 0; i--) {
            if (!this.projectiles[i].alive) this.projectiles.splice(i, 1);
        }

        // Items pickup
        for (let i = this.items.length-1; i >= 0; i--) {
            const it = this.items[i];
            it.update(sdt);
            if (!it.alive) { this.items.splice(i,1); continue; }
            const d = Math.hypot(it.x - p.x, it.y - p.y);
            if (d < p.r + 14) {
                this._pickupItem(it, p);
                this.items.splice(i,1);
            }
        }

        // Particles & effects
        this.particles.update(sdt);
        this.shake.update(dt);
        this.footprints.update(sdt);
        this.world.update(sdt);
        this.hud.update(sdt);
    }

    _barrelBlast(barrel) {
        for (const e of this.enemies) {
            if (!e.alive) continue;
            const d = Math.hypot(e.x-barrel.x, e.y-barrel.y);
            if (d < CFG.BARREL_RADIUS) {
                const killed = e.takeDamage(Math.round(CFG.BARREL_DMG * (1-d/CFG.BARREL_RADIUS*0.6)));
                if (killed) { e.alive=false; this.onEnemyDied(e, this.player); }
            }
        }
    }

    _pickupItem(item, player) {
        switch (item.type) {
            case 'health': {
                const heal = 30 * (1 + (this.skillTree.bonuses.healBonus||0));
                player.hp  = Math.min(player.maxHp + (this.skillTree.bonuses.maxHp||0), player.hp + heal);
                this.hud.addDmgNumber(item.x, item.y, `+${Math.round(heal)}HP`);
                break;
            }
            case 'ammo': {
                const w    = player.weapon;
                const cap  = Math.round(w.magSize * (1+(this.skillTree.bonuses.ammoCapacity||0)));
                player.ammo[w.id] = Math.min(cap, player.ammo[w.id] + Math.ceil(cap*0.5));
                break;
            }
            case 'shield':
                player.shield = Math.min(player.maxShield, player.shield + 25);
                break;
            case 'grenade':
                player.grenades += 1;
                break;
        }
        this.particles.emit(item.x, item.y, '#FFFFFF', 6, 40, 3, 0.5);
    }

    // ── render ────────────────────────────────────────────────────────────────

    _render() {
        const ctx  = this.ctx;
        const cam  = { x: this.cam.x + this.shake.dx, y: this.cam.y + this.shake.dy };

        // Day/night tint
        let nightAlpha = 0;
        if (FEATURES.dayNightCycle) {
            const phase = (this.dayTime % CFG.DAY_PERIOD) / CFG.DAY_PERIOD;
            nightAlpha  = phase < 0.5
                ? Math.sin(phase * Math.PI*2) * 0.5
                : Math.sin((1-phase) * Math.PI*2) * 0.5;
        }

        ctx.fillStyle = '#0a0800';
        ctx.fillRect(0, 0, CFG.CAM_W, CFG.CAM_H);

        // Scope zoom transform
        if (this.player.scopeZoom > 1.01) {
            ctx.save();
            const z = this.player.scopeZoom;
            ctx.translate(CFG.CAM_W/2, CFG.CAM_H/2);
            ctx.scale(z, z);
            ctx.translate(-CFG.CAM_W/2, -CFG.CAM_H/2);
        }

        this.world.render(ctx, cam);
        this.footprints.render(ctx, cam);
        this.particles.render(ctx, cam);

        // Items
        for (const it of this.items) it.render(ctx, cam);

        // Enemies
        const thermalOptics = this.skillTree.bonuses.thermalOptics;
        for (const e of this.enemies) e.render(ctx, cam, thermalOptics);

        // Projectiles
        for (const p of this.projectiles) p.render(ctx, cam);

        // Player
        this.player.render(ctx, cam);

        if (this.player.scopeZoom > 1.01) ctx.restore();

        // Night overlay
        if (nightAlpha > 0.02) {
            ctx.save();
            ctx.globalAlpha = nightAlpha;
            ctx.fillStyle   = '#000033';
            ctx.fillRect(0, 0, CFG.CAM_W, CFG.CAM_H);
            ctx.restore();
        }

        // Bullet-time vignette
        if (this.player.bulletTimeOn) {
            ctx.save(); ctx.globalAlpha = 0.22;
            const grad = ctx.createRadialGradient(CFG.CAM_W/2,CFG.CAM_H/2,CFG.CAM_H*0.3,CFG.CAM_W/2,CFG.CAM_H/2,CFG.CAM_H*0.7);
            grad.addColorStop(0, 'transparent');
            grad.addColorStop(1, '#002244');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, CFG.CAM_W, CFG.CAM_H);
            ctx.restore();
        }

        // Scope crosshair overlay
        if (this.player.scopeZoom > 1.01) {
            ctx.save(); ctx.globalAlpha = 0.35;
            ctx.strokeStyle = '#00FF00'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(CFG.CAM_W/2-40, CFG.CAM_H/2); ctx.lineTo(CFG.CAM_W/2+40, CFG.CAM_H/2);
            ctx.moveTo(CFG.CAM_W/2, CFG.CAM_H/2-40); ctx.lineTo(CFG.CAM_W/2, CFG.CAM_H/2+40);
            ctx.stroke();
            ctx.beginPath(); ctx.arc(CFG.CAM_W/2, CFG.CAM_H/2, 20, 0, Math.PI*2); ctx.stroke();
            ctx.restore();
        }

        // HUD (always on top of game world)
        this.hud.render(ctx, cam, this);
    }

    // ── main loop ─────────────────────────────────────────────────────────────

    _loop(ts) {
        const dt  = Math.min(0.05, (ts - this._last) / 1000);
        this._last = ts;
        if (this.state === 'playing') {
            this._update(dt);
            this._render();
        }
        requestAnimationFrame(ts2 => this._loop(ts2));
    }

    start() {
        requestAnimationFrame(ts => { this._last = ts; this._loop(ts); });
    }

    // ── death screen ──────────────────────────────────────────────────────────

    _showDeath() {
        const o = document.getElementById('deathOverlay');
        o.querySelector('#deathKills').textContent = this.player.kills;
        o.querySelector('#deathScore').textContent = this.player.score;
        o.querySelector('#deathWave').textContent  = this.wave;
        o.querySelector('#deathLevel').textContent = this.player.level;
        o.classList.add('visible');
    }

    // ── input ─────────────────────────────────────────────────────────────────

    _bindInput() {
        const keyMap = {
            KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right',
            ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
            ShiftLeft:'sprint', ShiftRight:'sprint',
        };

        document.addEventListener('keydown', e => {
            if (e.code === 'Escape') {
                if (this.state === 'playing') {
                    this.state = 'paused';
                    this.pauseMenu.show();
                } else if (this.state === 'paused') {
                    this.state = 'playing';
                    this.pauseMenu.hide();
                }
                return;
            }
            if (this.state !== 'playing') return;
            if (keyMap[e.code]) this.input[keyMap[e.code]] = true;

            // Weapon switch 1–0
            if (e.code.startsWith('Digit')) {
                const n = parseInt(e.key);
                const idx = n === 0 ? 9 : n - 1;
                this.player.switchTo(idx);
            }
            // R – reload
            if (e.code === 'KeyR') this.player._reload();
            // E – melee
            if (e.code === 'KeyE') this.player.melee(this.enemies, this.particles);
            // Space – dash
            if (e.code === 'Space') {
                const md = this._moveDir();
                this.player.dash(md.x, md.y);
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', e => {
            if (keyMap[e.code]) this.input[keyMap[e.code]] = false;
        });

        this.canvas.addEventListener('mousedown', e => {
            if (this.state !== 'playing') return;
            if (e.button === 0) {
                this.input.shoot = true;
                // Grenade on right-click handled below
            }
            if (e.button === 2) {
                if (e.shiftKey) {
                    this.player.throwGrenade(
                        this.mouseX + this.cam.x,
                        this.mouseY + this.cam.y,
                        this.projectiles
                    );
                } else {
                    this.input.rightClick = true;
                }
            }
        });

        this.canvas.addEventListener('mouseup', e => {
            if (e.button === 0) this.input.shoot = false;
            if (e.button === 2) this.input.rightClick = false;
        });

        this.canvas.addEventListener('mousemove', e => {
            const rect = this.canvas.getBoundingClientRect();
            this.mouseX = e.clientX - rect.left;
            this.mouseY = e.clientY - rect.top;
        });

        this.canvas.addEventListener('contextmenu', e => e.preventDefault());

        // Grenade – Q key
        document.addEventListener('keydown', e => {
            if (e.code === 'KeyQ' && this.state === 'playing') {
                const wx = this.mouseX + this.cam.x;
                const wy = this.mouseY + this.cam.y;
                this.player.throwGrenade(wx, wy, this.projectiles);
            }
        });
    }

    _moveDir() {
        let x = 0, y = 0;
        if (this.input.up)    y -= 1;
        if (this.input.down)  y += 1;
        if (this.input.left)  x -= 1;
        if (this.input.right) x += 1;
        if (!x && !y) { x = Math.cos(this.player.angle); y = Math.sin(this.player.angle); }
        return { x, y };
    }
}


// ──────────────────────────────────────────────────────────────────
// bootstrap
// ──────────────────────────────────────────────────────────────────
(function () {
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingFill   = document.getElementById('loadingFill');
    const startPrompt   = document.getElementById('startPrompt');

    let progress = 0;
    const tick = setInterval(() => {
        progress = Math.min(100, progress + (Math.random() * 18));
        loadingFill.style.width = progress + '%';
        if (progress >= 100) {
            clearInterval(tick);
            setTimeout(() => { startPrompt.style.display = 'block'; }, 200);
        }
    }, 80);

    let started = false;
    function startGame() {
        if (started) return;
        started = true;
        loadingScreen.style.display = 'none';

        const game = new Game();
        game.init();
        game.start();

        document.getElementById('restartBtn').addEventListener('click', () => game.restart());

        document.getElementById('pauseOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                game.pauseMenu.hide();
                game.state = 'playing';
            }
        });
    }

    document.addEventListener('click',   startGame, { once: true });
    document.addEventListener('keydown', startGame, { once: true });
}());
</script>
