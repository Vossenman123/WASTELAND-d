<html lang="nl">

<meta charset="UTF-8">

<title>BRAINROT VERTALER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
:root{--g:#3dffaa;--r:#ff4444;--y:#ffd700;--b:#44ccff;--bg:#0a1a0a;--p:#c77dff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Share Tech Mono',monospace;color:var(--g);
  min-height:100vh;overflow-x:hidden;}

/* CRT overlay */
#crt{position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.03) 0,rgba(0,0,0,0.03) 1px,transparent 1px,transparent 2px);}
#crt::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50%,transparent 50%,rgba(0,0,0,0.35) 100%);}

/* Header */
header{text-align:center;padding:24px 16px 12px;
  border-bottom:1px solid rgba(61,255,170,0.15);
  background:linear-gradient(to bottom,rgba(0,0,0,0.6),transparent);position:relative;}
header h1{font-family:'Orbitron',monospace;font-size:clamp(16px,3.5vw,28px);
  color:var(--g);text-shadow:0 0 20px var(--g),0 0 40px rgba(61,255,170,0.3);
  letter-spacing:6px;}
header p{font-size:10px;color:rgba(61,255,170,0.5);letter-spacing:3px;margin-top:6px;}
.back-link{position:absolute;top:16px;left:16px;color:var(--g);text-decoration:none;
  font-size:10px;letter-spacing:2px;border:1px solid rgba(61,255,170,0.3);
  padding:6px 12px;transition:all 0.2s;}
.back-link:hover{background:rgba(61,255,170,0.1);border-color:var(--g);}

/* Container */
.container{max-width:1000px;margin:0 auto;padding:20px 16px 40px;}

/* Mode selector */
.mode-selector{display:flex;gap:8px;justify-content:center;margin:20px 0;flex-wrap:wrap;}
.mode-btn{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;
  background:transparent;color:var(--g);border:1px solid rgba(61,255,170,0.3);
  padding:10px 20px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;}
.mode-btn:hover{background:rgba(61,255,170,0.08);border-color:var(--g);
  box-shadow:0 0 15px rgba(61,255,170,0.15);}
.mode-btn.active{background:rgba(61,255,170,0.15);border-color:var(--g);
  box-shadow:0 0 20px rgba(61,255,170,0.2);text-shadow:0 0 10px var(--g);}

/* Direction indicator */
.direction{text-align:center;margin:16px 0;font-size:12px;letter-spacing:3px;
  color:var(--y);text-shadow:0 0 10px var(--y);}
.direction .arrow{font-size:18px;margin:0 8px;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.5;}50%{opacity:1;}}

/* Translation area */
.translate-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;}
@media(max-width:700px){.translate-grid{grid-template-columns:1fr;}}

.text-panel{position:relative;}
.text-panel label{display:block;font-family:'Orbitron',monospace;font-size:10px;
  letter-spacing:3px;color:rgba(61,255,170,0.6);margin-bottom:8px;text-transform:uppercase;}
.text-panel label.brainrot-label{color:var(--p);}
.text-panel textarea{width:100%;height:220px;background:rgba(0,0,0,0.4);
  border:1px solid rgba(61,255,170,0.2);color:var(--g);font-family:'Share Tech Mono',monospace;
  font-size:13px;padding:14px;resize:vertical;line-height:1.6;
  transition:border-color 0.3s;}
.text-panel textarea:focus{outline:none;border-color:var(--g);
  box-shadow:0 0 20px rgba(61,255,170,0.1);}
.text-panel textarea.brainrot{color:var(--p);border-color:rgba(199,125,255,0.2);}
.text-panel textarea.brainrot:focus{border-color:var(--p);
  box-shadow:0 0 20px rgba(199,125,255,0.1);}

/* Action buttons */
.actions{display:flex;gap:8px;justify-content:center;margin:20px 0;flex-wrap:wrap;}
.action-btn{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;
  background:transparent;border:1px solid rgba(61,255,170,0.3);color:var(--g);
  padding:12px 24px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;
  position:relative;overflow:hidden;}
.action-btn:hover{background:rgba(61,255,170,0.1);border-color:var(--g);
  box-shadow:0 0 20px rgba(61,255,170,0.2);text-shadow:0 0 10px var(--g);}
.action-btn.translate-btn{border-color:var(--y);color:var(--y);}
.action-btn.translate-btn:hover{background:rgba(255,215,0,0.1);
  box-shadow:0 0 20px rgba(255,215,0,0.2);text-shadow:0 0 10px var(--y);}
.action-btn.copy-btn{border-color:var(--b);color:var(--b);}
.action-btn.copy-btn:hover{background:rgba(68,204,255,0.1);
  box-shadow:0 0 20px rgba(68,204,255,0.2);}
.action-btn.swap-btn{border-color:var(--p);color:var(--p);}
.action-btn.swap-btn:hover{background:rgba(199,125,255,0.1);
  box-shadow:0 0 20px rgba(199,125,255,0.2);}

/* Examples */
.examples{margin:24px 0;border:1px solid rgba(61,255,170,0.1);padding:16px;
  background:rgba(0,0,0,0.3);}
.examples h3{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;
  color:var(--y);margin-bottom:12px;text-shadow:0 0 10px rgba(255,215,0,0.3);}
.example-btns{display:flex;gap:8px;flex-wrap:wrap;}
.example-btn{font-family:'Share Tech Mono',monospace;font-size:10px;
  background:rgba(61,255,170,0.05);border:1px solid rgba(61,255,170,0.15);
  color:rgba(61,255,170,0.7);padding:8px 14px;cursor:pointer;transition:all 0.3s;}
.example-btn:hover{background:rgba(61,255,170,0.1);border-color:var(--g);color:var(--g);}

/* Stats bar */
.stats{display:flex;gap:20px;justify-content:center;margin:16px 0;flex-wrap:wrap;}
.stat{font-size:9px;letter-spacing:2px;color:rgba(61,255,170,0.4);}
.stat span{color:var(--y);font-family:'Orbitron',monospace;}

/* Toast notification */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
  background:rgba(0,0,0,0.9);border:1px solid var(--g);color:var(--g);
  padding:12px 24px;font-size:11px;letter-spacing:2px;z-index:200;
  transition:transform 0.3s ease;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* Brainrot level meter */
.level-meter{margin:16px 0;text-align:center;}
.level-meter label{font-size:9px;letter-spacing:2px;color:rgba(61,255,170,0.5);}
.meter-bar{width:100%;max-width:400px;height:8px;background:rgba(0,0,0,0.5);
  border:1px solid rgba(61,255,170,0.15);margin:8px auto;position:relative;overflow:hidden;}
.meter-fill{height:100%;transition:width 0.5s ease,background 0.5s ease;width:0%;}
.meter-text{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;
  margin-top:4px;}

/* Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.3);}
::-webkit-scrollbar-thumb{background:rgba(61,255,170,0.3);}
::-webkit-scrollbar-thumb:hover{background:var(--g);}
</style>

/* ── Translation logic ── */
function vertaal() {
  const input = document.getElementById('input-text').value.trim();
  if (!input) {
    showToast('⚠️ Typ eerst een tekst!');
    return;
  }

  let result;
  let replacementCount = 0;
  const dict = currentMode === 'zakelijk' ? zakelijkNaarBrainrot : brainrotNaarZakelijk;

  result = input;
  for (const [from, to] of dict) {
    const regex = new RegExp(escapeRegex(from), 'gi');
    const matches = result.match(regex);
    if (matches) {
      replacementCount += matches.length;
      result = result.replace(regex, (match) => matchCase(match, to));
    }
  }

  // Add brainrot flair if translating to brainrot
  if (currentMode === 'zakelijk') {
    result = addBrainrotFlair(result);
  } else {
    result = addFormalFlair(result);
  }

  document.getElementById('output-text').value = result;
  updateStats(input, result, replacementCount);
  showToast('✅ Vertaald! ' + (currentMode === 'zakelijk' ? '🧠' : '📧'));
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function matchCase(original, replacement) {
  if (original === original.toUpperCase() && original.length > 1) {
    return replacement.toUpperCase();
  }
  if (original[0] === original[0].toUpperCase()) {
    return replacement.charAt(0).toUpperCase() + replacement.slice(1);
  }
  return replacement;
}

function addBrainrotFlair(text) {
  // Add some random brainrot endings to sentences
  const flairs = [' 💀', ' 😭', ' fr', ' no cap', ' 🔥', ' ong', ' 💯'];
  const lines = text.split('\n');
  return lines.map(line => {
    if (line.trim().length > 30 && !line.trim().endsWith(',') && Math.random() > 0.6) {
      const flair = flairs[Math.floor(Math.random() * flairs.length)];
      // Remove trailing period/dot before adding flair
      if (line.trim().endsWith('.')) {
        line = line.trimEnd().slice(0, -1) + flair;
      }
    }
    return line;
  }).join('\n');
}

function addFormalFlair(text) {
  // Clean up informal punctuation
  let result = text;
  result = result.replace(/\s*💀/g, '.');
  result = result.replace(/\s*😭/g, '.');
  result = result.replace(/\s*🔥/g, '.');
  result = result.replace(/\s*💯/g, '.');
  result = result.replace(/\s*ong\b/gi, '.');
  result = result.replace(/!{2,}/g, '!');
  result = result.replace(/\?{2,}/g, '?');
  return result;
}

function updateStats(input, output, replacements) {
  const words = input.split(/\s+/).filter(w => w.length > 0).length;
  const brainrotLevel = Math.min(100, Math.round((replacements / Math.max(words, 1)) * 150));

  document.getElementById('stat-words').textContent = words;
  document.getElementById('stat-replacements').textContent = replacements;
  document.getElementById('stat-level').textContent = brainrotLevel;

  const meter = document.getElementById('meter-fill');
  const meterText = document.getElementById('meter-text');
  meter.style.width = brainrotLevel + '%';

  if (brainrotLevel < 20) {
    meter.style.background = 'var(--g)';
    meterText.style.color = 'var(--g)';
    meterText.textContent = 'NORMAAL 🤓';
  } else if (brainrotLevel < 40) {
    meter.style.background = 'var(--b)';
    meterText.style.color = 'var(--b)';
    meterText.textContent = 'LICHT AANGETAST 😏';
  } else if (brainrotLevel < 60) {
    meter.style.background = 'var(--y)';
    meterText.style.color = 'var(--y)';
    meterText.textContent = 'BEHOORLIJK BRAINROT 🧠';
  } else if (brainrotLevel < 80) {
    meter.style.background = 'var(--r)';
    meterText.style.color = 'var(--r)';
    meterText.textContent = 'ERNSTIGE BRAINROT 💀';
  } else {
    meter.style.background = 'var(--p)';
    meterText.style.color = 'var(--p)';
    meterText.textContent = 'TERMINALE BRAINROT ☠️';
  }
}

/* ── Mode switching ── */
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-' + mode).classList.add('active');

  const dir = document.getElementById('direction-text');
  const inputLabel = document.getElementById('input-label');
  const outputLabel = document.getElementById('output-label');
  const inputArea = document.getElementById('input-text');
  const outputArea = document.getElementById('output-text');

  if (mode === 'zakelijk') {
    dir.innerHTML = 'ZAKELIJK <span class="arrow">▶▶▶</span> BRAINROT';
    inputLabel.textContent = '📧 INVOER — ZAKELIJKE TEKST';
    inputLabel.classList.remove('brainrot-label');
    outputLabel.textContent = '🧠 UITVOER — BRAINROT';
    outputLabel.classList.add('brainrot-label');
    inputArea.classList.remove('brainrot');
    outputArea.classList.add('brainrot');
    inputArea.placeholder = 'Typ hier je zakelijke email...';
    outputArea.placeholder = 'De brainrot vertaling verschijnt hier...';
  } else {
    dir.innerHTML = 'BRAINROT <span class="arrow">▶▶▶</span> ZAKELIJK';
    inputLabel.textContent = '🧠 INVOER — BRAINROT TEKST';
    inputLabel.classList.add('brainrot-label');
    outputLabel.textContent = '📧 UITVOER — ZAKELIJKE TEKST';
    outputLabel.classList.remove('brainrot-label');
    inputArea.classList.add('brainrot');
    outputArea.classList.remove('brainrot');
    inputArea.placeholder = 'Typ hier je brainrot tekst...';
    outputArea.placeholder = 'De zakelijke vertaling verschijnt hier...';
  }
}

/* ── Utility functions ── */
function swapTexts() {
  const input = document.getElementById('input-text');
  const output = document.getElementById('output-text');
  const temp = output.value;
  input.value = temp;
  output.value = '';

  // Switch mode
  setMode(currentMode === 'zakelijk' ? 'brainrot' : 'zakelijk');
  showToast('🔄 Gewisseld!');
}

function kopieer() {
  const output = document.getElementById('output-text').value;
  if (!output) {
    showToast('⚠️ Niets om te kopiëren!');
    return;
  }
  navigator.clipboard.writeText(output).then(() => {
    showToast('📋 Gekopieerd naar klembord!');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = output;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('📋 Gekopieerd!');
  });
}

function clearAll() {
  document.getElementById('input-text').value = '';
  document.getElementById('output-text').value = '';
  document.getElementById('stat-words').textContent = '0';
  document.getElementById('stat-replacements').textContent = '0';
  document.getElementById('stat-level').textContent = '0';
  document.getElementById('meter-fill').style.width = '0%';
  document.getElementById('meter-text').textContent = '—';
  document.getElementById('meter-text').style.color = 'rgba(61,255,170,0.4)';
  showToast('🗑️ Gewist!');
}

function loadExample(key) {
  const text = examples[key];
  if (!text) return;

  // Auto-detect mode based on example
  if (key.startsWith('brainrot')) {
    setMode('brainrot');
  } else {
    setMode('zakelijk');
  }

  document.getElementById('input-text').value = text;
  document.getElementById('output-text').value = '';
  showToast('📝 Voorbeeld geladen!');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

/* ── Auto-translate on typing (with debounce) ── */
let debounceTimer;
document.getElementById('input-text').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    if (document.getElementById('input-text').value.trim().length > 0) {
      vertaal();
    }
  }, 500);
});
